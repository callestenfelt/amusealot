<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>{% block title %}AmuseAlot{% endblock %}</title>
  <style>
    :root { color-scheme: light only; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      background-color: #fbfbfb;
      color: #080229;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 60px 24px;
      flex: 1;
    }
    h1 {
      font-size: clamp(48px, 13vw, 64px);
      font-weight: bold;
      letter-spacing: -4px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
    }
    .subtitle {
      font-size: 14px;
      color: #080229;
      letter-spacing: 0.5px;
      margin-bottom: 48px;
    }
    h2 {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 3px solid #080229;
    }
    p {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    a {
      color: #080229;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover {
      color: #12084E;
    }
    .dotline {
      height: 1px;
      background-image: repeating-linear-gradient(to right, #080229 0, #080229 2px, transparent 2px, transparent 6px);
      margin: 32px 0;
    }
    .footer {
      background-color: #080229;
      padding: 40px 24px;
      text-align: center;
    }
    .footer span, .footer a {
      font-size: 14px;
      color: #fbfbfb;
    }
    .footer a:hover {
      color: #C4BBF6;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #080229;
      color: #fbfbfb;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 32px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .btn:hover {
      background-color: #12084E;
      color: #fbfbfb;
    }
    input[type="email"] {
      width: 100%;
      font-size: 16px;
      padding: 14px 16px;
      border: 2px solid #080229;
      background: transparent;
      color: #080229;
      font-family: inherit;
      margin-bottom: 16px;
    }
    input[type="email"]::placeholder {
      color: #080229;
      opacity: 0.6;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: #080229;
    }
    .error {
      color: #8B0000;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .backnav {
      margin-bottom: 24px;
    }
    .backnav a {
      font-size: 14px;
      text-decoration: none;
    }
    .backnav a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .beta-chip {
      display: inline-block;
      background-color: #080229;
      color: #fbfbfb;
      font-size: clamp(9px, 2vw, 11px);
      font-weight: bold;
      letter-spacing: -0.2px;
      padding: 5px 10px;
      border-radius: 7px;
      vertical-align: middle;
      position: relative;
      top: -0.2em;
      margin-left: 4px;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #fbfbfb !important; color: #080229 !important; }
      .footer { background-color: #080229 !important; }
      .footer span, .footer a { color: #fbfbfb !important; }
      .footer a:hover { color: #C4BBF6 !important; }
      a:hover { color: #12084E !important; }
      .btn:hover { background-color: #12084E !important; }
      .btn { background-color: #080229 !important; color: #fbfbfb !important; }
      h2 { border-bottom-color: #080229 !important; }
      input[type="email"] { border-color: #080229 !important; color: #080229 !important; background: transparent !important; }
      .dotline { background-image: repeating-linear-gradient(to right, #080229 0, #080229 2px, transparent 2px, transparent 6px) !important; }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
  <div class="footer">
    <span>
      <a href="/">AmuseAlot</a>
      &middot;
      <a href="/archive">Archive</a>
      &middot;
      <a href="/about">About</a>
      &middot;
      <a href="/privacy">Privacy Policy</a>
    </span>
  </div>
</body>
</html>
